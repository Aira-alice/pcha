  #phone { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; width: 100%; height: 100%; display: flex; flex-direction: column; position: relative; overflow: hidden; }

    #phone { max-width: 460px; height: 94dvh; margin: 3dvh 0; border-radius: 28px; box-shadow: 0 0 60px rgba(0,0,0,0.25); }
  }
  .lc-scrollbar-hide::-webkit-scrollbar { display: none; }
  .lc-scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  @keyframes lc-spin { to { transform: rotate(360deg); } }
  @keyframes lc-toast-in { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
  @keyframes lc-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
  #phone input::placeholder { color: var(--muted, #888); }
  #phone button, #phone input { font-family: inherit; }
  #phone button { -webkit-tap-highlight-color: transparent; }
</style>
</head>

/* ======================= utilities ======================= */
function escapeHtml(str) {
  return String(str == null ? "" : str).replace(/[&<>"']/g, (s) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[s]));
}
function escapeAttr(str) { return escapeHtml(str); }
function nowTime() { return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }
function formatDuration(s) { s = Math.max(0, Math.floor(s || 0)); const m = Math.floor(s / 60); const sec = s % 60; return m + ":" + String(sec).padStart(2, "0"); }
function formatBytes(b) { if (b == null) return ""; if (b < 1024) return b + " B"; if (b < 1024 * 1024) return (b / 1024).toFixed(1) + " KB"; return (b / (1024 * 1024)).toFixed(1) + " MB"; }
function hashId(id) { let h = 0; const s = String(id); for (let i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) >>> 0; } return h; }
function getContact(id) { return state.contacts.find((c) => c.id === id) || state.groups.find((g) => g.id === id) || state.broadcasts.find((b) => b.id === id); }
function findMessage(id) { for (const cid in state.messagesByContact) { const m = (state.messagesByContact[cid] || []).find((x) => x.id === id); if (m) return m; } return null; }
function getEffectiveTheme() {
  if (state.screen === "chat" || state.screen === "contactProfile" || state.screen === "chatMedia") {
    const c = getContact(state.selectedContactId);
    if (c && c.chatTheme) return THEMES[c.chatTheme];
  }
  return THEMES[state.themeKey];
}
function fileToDataURL(file) { return new Promise((resolve, reject) => { const r = new FileReader(); r.onload = () => resolve(r.result); r.onerror = reject; r.readAsDataURL(file); }); }
function avatarHTML(label, avatarUrl, colorSeed, size) {
  size = size || 44;
  if (avatarUrl) return `<img src="${avatarUrl}" style="width:${size}px;height:${size}px;border-radius:50%;object-fit:cover;flex-shrink:0;">`;
  const color = AVATAR_COLORS[Math.abs(colorSeed) % AVATAR_COLORS.length];
  const initial = (label || "?").replace("@", "")[0].toUpperCase();
  return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${color}33;color:${color};display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:${Math.round(size * 0.38)}px;flex-shrink:0;vertical-align:middle;">${initial}</div>`;
}
function conversationAvatarHTML(item, t, size) {
  size = size || 44;
  if (item.kind === "group") {
    const color = AVATAR_COLORS[Math.abs(hashId(item.id)) % AVATAR_COLORS.length];
    return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${color}33;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;vertical-align:middle;">${iconUsers(color, Math.round(size * 0.48))}</div>`;
  }
  if (item.kind === "broadcast") {
    const color = AVATAR_COLORS[Math.abs(hashId(item.id)) % AVATAR_COLORS.length];
    return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${color}33;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;vertical-align:middle;">${iconBroadcast(color, Math.round(size * 0.48))}</div>`;
  }
  return avatarHTML(item.name || item.username, item.avatar, hashId(item.id), size);
}
function showToast(msg) {
  state.toast = msg;
  render();
  clearTimeout(window.__lcToastTimer);
  window.__lcToastTimer = setTimeout(() => { state.toast = null; render(); }, 2200);
}
function lastMessagePreview(msg) {
  return msg.type === "text" ? msg.text : msg.type === "image" ? "📷 Photo" : msg.type === "file" ? "📎 " + msg.fileName : "🎤 Voice message";
}
function pushMessage(partial) {
  const id = uid();
  const msg = Object.assign({ id, sender: "me", time: nowTime(), status: "sent" }, partial);
  const cid = state.selectedContactId;
  if (!state.messagesByContact[cid]) state.messagesByContact[cid] = [];
  state.messagesByContact[cid].push(msg);
  const c = getContact(cid);
  if (c) {
    c.lastMessage = lastMessagePreview(msg);
    c.time = msg.time;
    c.lastActivityAt = Date.now();
  }
  render();
  setTimeout(() => updateMsgStatus(cid, id, "delivered"), 900);
  setTimeout(() => updateMsgStatus(cid, id, "read"), 1900);

  if (c && c.kind === "broadcast") {
    c.memberIds.forEach((mid) => {
      const target = getContact(mid);
      if (!target || target.blocked) return;
      const copyId = uid();
      const copy = Object.assign({}, msg, { id: copyId });
      if (!state.messagesByContact[mid]) state.messagesByContact[mid] = [];
      state.messagesByContact[mid].push(copy);
      target.lastMessage = lastMessagePreview(copy);
      target.time = copy.time;
      target.lastActivityAt = Date.now();
      scheduleAutoReply(mid);
    });
    render();
  } else if (c && (c.kind === "contact" || c.kind === "group") && !c.blocked) {
    scheduleAutoReply(cid);
  }
}
function updateMsgStatus(cid, id, status) {
  const arr = state.messagesByContact[cid];
  if (!arr) return;
  const m = arr.find((x) => x.id === id);
  if (m) { m.status = status; render(); }
}
const AUTO_REPLIES = ["Oke, siap!", "Baik, noted ya 👍", "Wah, asik juga", "Hehe iya bener", "Sebentar ya, lagi di luar", "Siap, ditunggu", "Wkwk bisa jadi", "Oke deh, gas", "Mantap 🔥", "Noted, makasih infonya"];
function pushIncomingMessage(cid, partial) {
  const id = uid();
  const msg = Object.assign({ id, sender: "them", time: nowTime(), status: "read" }, partial);
  if (!state.messagesByContact[cid]) state.messagesByContact[cid] = [];
  state.messagesByContact[cid].push(msg);
  const c = getContact(cid);
  if (c) {
    c.lastMessage = (msg.senderName ? msg.senderName + ": " : "") + lastMessagePreview(msg);
    c.time = msg.time;
    c.lastActivityAt = Date.now();
    const isOpen = state.screen === "chat" && state.selectedContactId === cid;
    if (!isOpen) c.unread = (c.unread || 0) + 1;
  }
  render();
}
function scheduleAutoReply(cid) {
  const c0 = getContact(cid);
  if (!c0 || (c0.kind !== "contact" && c0.kind !== "group")) return;
  const typingDelay = 500 + Math.random() * 900;
  const replyDelay = typingDelay + 1100 + Math.random() * 1700;
  // Contacts visibly flip to "Typing…" for a bit before their reply lands —
  // this is what actually drives the status text now, instead of it sitting fixed.
  if (c0.kind === "contact") {
    setTimeout(() => {
      const c = getContact(cid);
      if (c && c.kind === "contact" && !c.blocked) { c.status = "typing"; render(); }
    }, typingDelay);
  }
  setTimeout(() => {
    const c = getContact(cid);
    if (!c || c.blocked) return;
    const text = AUTO_REPLIES[Math.floor(Math.random() * AUTO_REPLIES.length)];
    if (c.kind === "group") {
      const others = (c.members || []).filter((m) => m.id !== "me");
      if (others.length === 0) return;
      const sender = others[Math.floor(Math.random() * others.length)];
      pushIncomingMessage(cid, { type: "text", text, senderName: sender.name || sender.username });
    } else if (c.kind === "contact") {
      c.status = "online";
      pushIncomingMessage(cid, { type: "text", text });
    }
  }, replyDelay);
}
// Ambient presence: every few seconds, contacts who aren't mid-"typing" have a
// chance to flip online/offline on their own, so the status is a live simulation
// rather than a value fixed at creation.
function tickAmbientPresence() {
  let changed = false;
  state.contacts.forEach((c) => {
    if (c.blocked || c.status === "typing") return;
    if (Math.random() < 0.3) {
      c.status = c.status === "online" ? "offline" : "online";
      changed = true;
    }
  });
  if (changed) render();
}

function renderQrPattern(seed) {
  let h = hashId(seed || "lc");
  const cells = 7;
  let cellsHtml = "";
  for (let i = 0; i < cells * cells; i++) {
    h = (h * 1103515245 + 12345) >>> 0;
    const on = (h % 3) !== 0;
    const r = Math.floor(i / cells), c2 = i % cells;
    const isFinder = (r < 3 && c2 < 3) || (r < 3 && c2 >= cells - 3) || (r >= cells - 3 && c2 < 3);
    cellsHtml += `<div style="background:${(isFinder || on) ? "#111" : "#fff"};"></div>`;
  }
  return `<div style="display:grid;grid-template-columns:repeat(${cells},1fr);gap:2px;width:100%;height:100%;">${cellsHtml}</div>`;
}

  if (state.screen === "home") {
    html += `<div style="display:flex;border-top:1px solid ${t.border};background:${t.surface};">
      ${TABS.map((tab, i) => `<button data-action="setTab" data-index="${i}" style="flex:1;padding:10px 0 8px;background:transparent;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:${i === state.tabIndex ? t.accent : t.textMuted};">${(tab.key === "chats" ? iconMessageCircle : tab.key === "pgame" ? iconGamepad : iconDownloadCloud)(i === state.tabIndex ? t.accent : t.textMuted,20)}<span style="font-size:10.5px;font-weight:${i === state.tabIndex ? 700 : 500};">${tab.label}</span></button>`).join("")}
    </div>`;
  }
  if (state.toast) html += renderToast(t);
  if (state.showAddModal) html += renderAddModal(t);
  if (state.emojiPickerOpen) html += renderEmojiPicker(t);
  if (state.attachMenuOpen) html += renderAttachMenu(t);
  if (state.chatThemePicker) html += renderChatThemePickerSheet(t);
  if (state.showCreateGroupModal) html += renderCreateGroupModal(t);
  if (state.showCreateBroadcastModal) html += renderCreateBroadcastModal(t);
  if (state.showQrModal) html += renderQrModal(t);
  if (state.modePickerOpen) html += renderModePickerSheet(t);
  return html;
}

let app;
function render() {
  const t = getEffectiveTheme();
  const phoneEl = document.getElementById("phone");
  phoneEl.style.background = t.bg;
  phoneEl.style.color = t.text;
  phoneEl.style.setProperty("--muted", t.textMuted);

  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && typeof active.selectionStart === "number" ? active.selectionStart : null;

  app.innerHTML = buildHTML(t);

  if (activeId) {
    const el = document.getElementById(activeId);
    if (el) {
      el.focus();
      if (selStart != null && typeof el.setSelectionRange === "function") {
        try { el.setSelectionRange(selStart, selStart); } catch (e) {}
      }
    }
  }
  postRender();
}
function postRender() {
  if (state.screen === "chat" && !state.chatSearchOpen) {
    const el = document.getElementById("chatScroll");
    if (el) el.scrollTop = el.scrollHeight;
  }
  document.querySelectorAll("audio[data-msg-audio]").forEach((a) => { a.onended = () => { state.playingMsgId = null; render(); }; });
  if (state.playingMsgId) {
    const el = document.getElementById("audio-" + state.playingMsgId);
    if (el) el.play().catch(() => {});
  }
}

/* ======================= recording ======================= */
async function startRecording() {
  if (state.recording) return;
  state.recording = true; state.recordSeconds = 0; state.recordMock = false; state.recordCancelled = false;
  render();
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mr = new MediaRecorder(stream);
      state.mediaRecorder = mr; state.recordedChunks = [];
      mr.ondataavailable = (ev) => { if (ev.data && ev.data.size > 0) state.recordedChunks.push(ev.data); };
      mr.onstop = () => {
        stream.getTracks().forEach((tr) => tr.stop());
        if (!state.recordCancelled) {
          const blob = new Blob(state.recordedChunks, { type: "audio/webm" });
          const url = URL.createObjectURL(blob);
          pushMessage({ type: "voice", audioUrl: url, duration: state.recordSeconds });
        }
        state.mediaRecorder = null;
      };
      mr.start();
    } catch (err) { state.recordMock = true; }
  } else { state.recordMock = true; }
  state.recordTimer = setInterval(() => { state.recordSeconds++; render(); }, 1000);
}
function stopRecording(cancel) {
  if (!state.recording) return;
  clearInterval(state.recordTimer);
  state.recording = false;
  state.recordCancelled = !!cancel;
  if (state.recordMock) {
    if (!cancel) pushMessage({ type: "voice", audioUrl: null, duration: state.recordSeconds });
    state.recordMock = false;
    render();
    return;
  }
  if (state.mediaRecorder && state.mediaRecorder.state !== "inactive") state.mediaRecorder.stop();
  render();
}

/* ======================= actions ======================= */
const actions = {
  nav(el) { navigateTo(el.dataset.value); },
  back() { goBack(); },
  noop() {},
  setTab(el) { state.tabIndex = parseInt(el.dataset.index, 10); render(); },
  toggleMenu() { state.menuOpen = !state.menuOpen; render(); },
  closeMenu() { state.menuOpen = false; render(); },
  toggleChatMenu() { state.chatMenuOpen = !state.chatMenuOpen; render(); },
  closeChatMenu() { state.chatMenuOpen = false; render(); },
  selectTheme(el) { state.themeKey = el.dataset.theme; render(); },
  toggleBlockNewPeople() { state.blockNewPeople = !state.blockNewPeople; render(); },
  openChat(el) { state.selectedContactId = el.dataset.id; navigateTo("chat"); },
  openMemberChat(el) {
    const memberId = el.dataset.id;
    const username = el.dataset.username;
    const name = el.dataset.name || "";
    if (memberId === "me") return;
    let contact = state.contacts.find((c) => c.id === memberId || c.username === username);
    if (!contact) {
      contact = { id: memberId, username: username, name: name, avatar: null, lastMessage: "", time: "", lastActivityAt: Date.now(), status: "offline", muted: false, blocked: false, chatTheme: null, kind: "contact", unread: 0 };
      state.contacts.unshift(contact);
    }
    state.selectedContactId = contact.id;
    navigateTo("chat");
  },
  acceptRequest() {
    const id = uid();
    state.contacts.unshift({ id, username: state.pendingRequest.username, name: "", avatar: null, lastMessage: "You are now connected", time: "now", lastActivityAt: Date.now(), status: "offline", muted: false, blocked: false, chatTheme: null, kind: "contact", unread: 0 });
    showToast(`You're connected with ${state.pendingRequest.username}`);
    state.pendingRequest = null;
    render();
  },
  declineRequest() { showToast("Request declined"); state.pendingRequest = null; render(); },
  openAddModal() { state.showAddModal = true; state.addQuery = ""; render(); },
  closeAddModal() { state.showAddModal = false; render(); },
  openModePicker() { state.modePickerOpen = true; render(); },
  closeModePicker() { state.modePickerOpen = false; render(); },
  setConnectionMode(el) {
    const mode = el.dataset.mode;
    state.connectionMode = mode;
    state.modePickerOpen = false;
    showToast(`Mode diubah ke ${CONNECTION_MODES[mode].short}`);
    render();
  },

  sendRequestTo(el) {
    const u = el.dataset.username;
    state.showAddModal = false; state.addQuery = "";
    showToast(`Request sent to ${u}`);
    render();
    setTimeout(() => {
      const id = uid();
      state.contacts.push({ id, username: u, name: "", avatar: null, lastMessage: "Hi, thanks for adding me!", time: nowTime(), lastActivityAt: Date.now(), status: "online", muted: false, blocked: false, chatTheme: null, kind: "contact", unread: 1 });
      state.messagesByContact[id] = [{ id: uid(), sender: "them", type: "text", text: "Hi, thanks for adding me!", time: nowTime(), status: "read" }];
      showToast(`${u} accepted your request`);
      render();
    }, 1500);
  },
  openCreateGroup() { state.showCreateGroupModal = true; state.newGroupName = ""; state.newGroupMemberIds = []; render(); },
  closeCreateGroupModal() { state.showCreateGroupModal = false; render(); },
  toggleGroupMember(el) {
    const id = el.dataset.id;
    const i = state.newGroupMemberIds.indexOf(id);
    if (i >= 0) state.newGroupMemberIds.splice(i, 1); else state.newGroupMemberIds.push(id);
    render();
  },
  createGroup() {
    const name = (state.newGroupName || "").trim();
    if (!name) { showToast("Enter a group name"); return; }
    if (state.newGroupMemberIds.length === 0) { showToast("Select at least one member"); return; }
    const id = "grp_" + uid();
    const members = state.newGroupMemberIds.map((cid) => { const c = getContact(cid); return { id: c.id, username: c.username, name: c.name || c.username }; });
    members.push({ id: "me", username: state.myAccount.username, name: state.myAccount.name });
    const group = { id, name, avatar: null, lastMessage: `${state.myAccount.name} created the group "${name}"`, time: nowTime(), lastActivityAt: Date.now(), muted: false, blocked: false, chatTheme: null, kind: "group", members, unread: 0 };
    state.groups.unshift(group);
    state.messagesByContact[id] = [{ id: uid(), sender: "them", type: "text", text: `${state.myAccount.name} created the group "${name}"`, time: nowTime(), status: "read", senderName: "System" }];
    state.showCreateGroupModal = false;
    state.selectedContactId = id;
    navigateTo("chat");
  },
  leaveGroup(el) {
    const id = el.dataset.id;
    if (!confirm("Leave this group? You won't receive its messages anymore.")) return;
    state.groups = state.groups.filter((g) => g.id !== id);
    delete state.messagesByContact[id];
    if (state.selectedContactId === id) state.selectedContactId = null;
    navigateTo("home");
    showToast("You left the group");
  },
  openCreateBroadcast() { state.showCreateBroadcastModal = true; state.newBroadcastName = ""; state.newBroadcastMemberIds = []; render(); },
  closeCreateBroadcastModal() { state.showCreateBroadcastModal = false; render(); },
  toggleBroadcastMember(el) {
    const id = el.dataset.id;
    const i = state.newBroadcastMemberIds.indexOf(id);
    if (i >= 0) state.newBroadcastMemberIds.splice(i, 1); else state.newBroadcastMemberIds.push(id);
    render();
  },
  createBroadcast() {
    const name = (state.newBroadcastName || "").trim() || "Broadcast list";
    if (state.newBroadcastMemberIds.length === 0) { showToast("Select at least one recipient"); return; }
    const id = "bc_" + uid();
    const broadcast = { id, name, avatar: null, lastMessage: "Broadcast list created", time: nowTime(), lastActivityAt: Date.now(), muted: false, blocked: false, chatTheme: null, kind: "broadcast", memberIds: state.newBroadcastMemberIds.slice(), unread: 0 };
    state.broadcasts.unshift(broadcast);
    state.messagesByContact[id] = [{ id: uid(), sender: "them", type: "text", text: "Broadcast list created", time: nowTime(), status: "read", senderName: "System" }];
    state.showCreateBroadcastModal = false;
    state.selectedContactId = id;
    navigateTo("chat");
  },
  deleteBroadcast(el) {
    const id = el.dataset.id;
    if (!confirm("Delete this broadcast list?")) return;
    state.broadcasts = state.broadcasts.filter((b) => b.id !== id);
    delete state.messagesByContact[id];
    if (state.selectedContactId === id) state.selectedContactId = null;
    navigateTo("home");
    showToast("Broadcast list deleted");
  },
  openQrModal() { state.showQrModal = true; render(); },
  closeQrModal() { state.showQrModal = false; render(); },
  scanQr() { state.showQrModal = false; showToast("Camera isn't available in this preview"); render(); },
  enterHomeSelectMode() { state.homeSelectMode = true; state.homeSelectedIds = []; state.menuOpen = false; render(); },
  exitHomeSelectMode() { state.homeSelectMode = false; state.homeSelectedIds = []; render(); },
  toggleHomeSelect(el) {
    const id = el.dataset.id;
    const i = state.homeSelectedIds.indexOf(id);
    if (i >= 0) state.homeSelectedIds.splice(i, 1); else state.homeSelectedIds.push(id);
    render();
  },
  muteSelectedHome() {
    if (!state.homeSelectedIds.length) return;
    state.homeSelectedIds.forEach((id) => { const c = getContact(id); if (c) c.muted = !c.muted; });
    showToast("Updated mute status");
    state.homeSelectMode = false; state.homeSelectedIds = [];
    render();
  },
  deleteSelectedHome() {
    if (!state.homeSelectedIds.length) return;
    if (!confirm(`Clear ${state.homeSelectedIds.length} chat(s)? Contacts and groups are kept — but cleared contacts and broadcasts will disappear from this list until you start a new chat. Groups stay in the list; leave a group to remove it.`)) return;
    state.homeSelectedIds.forEach((id) => {
      state.messagesByContact[id] = [];
      const c = getContact(id);
      if (c) c.lastMessage = "";
    });
    showToast("Chat cleared");
    state.homeSelectMode = false; state.homeSelectedIds = [];
    render();
  },
  viewAvatar(el) { const c = getContact(el.dataset.id); if (c && c.avatar) window.open(c.avatar, "_blank"); else showToast("No profile photo set"); },
  viewOwnAvatar() { const a = state.myAccount; if (a.avatar) window.open(a.avatar, "_blank"); else showToast("No profile photo set"); },
  sendMessage() {
    const c = getContact(state.selectedContactId);
    if (!c || c.blocked) return;
    if (!state.draft || !state.draft.trim()) return;
    const text = state.draft.trim();
    state.draft = "";
    pushMessage({ type: "text", text });
  },
  toggleAttachMenu() { state.attachMenuOpen = !state.attachMenuOpen; state.emojiPickerOpen = false; render(); },
  closeAttachMenu() { state.attachMenuOpen = false; render(); },
  toggleEmojiPicker() { state.emojiPickerOpen = !state.emojiPickerOpen; state.attachMenuOpen = false; render(); },
  closeEmojiPicker() { state.emojiPickerOpen = false; render(); },
  setEmojiTab(el) { state.emojiTab = el.dataset.tab; render(); },
  insertEmoji(el) { state.draft += el.dataset.emoji; render(); const inp = document.getElementById("input-draft"); if (inp) inp.focus(); },
  clickInput(el) { state.attachMenuOpen = false; render(); const input = document.getElementById(el.dataset.target); if (input) input.click(); },
  toast(el) { showToast(el.dataset.msg || "This isn't available in this preview"); },
  openChatSearch() { state.chatSearchOpen = true; state.chatMenuOpen = false; state.chatSearchQuery = ""; render(); },
  closeChatSearch() { state.chatSearchOpen = false; state.chatSearchQuery = ""; render(); },
  openMedia() { state.chatMenuOpen = false; navigateTo("chatMedia"); },
  enterSelectMode() { state.selectMode = true; state.selectedMsgIds = []; state.chatMenuOpen = false; render(); },
  exitSelectMode() { state.selectMode = false; state.selectedMsgIds = []; render(); },
  toggleSelectMsg(el) {
    const id = el.dataset.id;
    const i = state.selectedMsgIds.indexOf(id);
    if (i >= 0) state.selectedMsgIds.splice(i, 1); else state.selectedMsgIds.push(id);
    render();
  },
  deleteSelected() {
    if (state.selectedMsgIds.length === 0) return;
    if (!confirm(`Delete ${state.selectedMsgIds.length} message(s)?`)) return;
    const cid = state.selectedContactId;
    state.messagesByContact[cid] = (state.messagesByContact[cid] || []).filter((m) => !state.selectedMsgIds.includes(m.id));
    state.selectMode = false; state.selectedMsgIds = [];
    showToast("Messages deleted");
    render();
  },
  copySelected() {
    const cid = state.selectedContactId;
    const msgs = (state.messagesByContact[cid] || []).filter((m) => state.selectedMsgIds.includes(m.id));
    const text = msgs.map((m) => (m.type === "text" ? m.text : m.type === "image" ? "[Photo]" : m.type === "file" ? `[File: ${m.fileName}]` : "[Voice message]")).join("\n");
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => showToast("Copied")).catch(() => showToast("Copy failed"));
    } else { showToast("Copy not supported"); }
    state.selectMode = false; state.selectedMsgIds = [];
    render();
  },
  starSelected() {
    const cid = state.selectedContactId;
    const msgs = (state.messagesByContact[cid] || []).filter((m) => state.selectedMsgIds.includes(m.id));
    const allStarred = msgs.length > 0 && msgs.every((m) => m.starred);
    msgs.forEach((m) => { m.starred = !allStarred; });
    state.selectMode = false; state.selectedMsgIds = [];
    showToast(allStarred ? "Removed from starred" : "Message starred");
    render();
  },
  openChatThemePicker() { state.chatThemePicker = true; state.chatMenuOpen = false; render(); },
  closeChatThemePicker() { state.chatThemePicker = false; render(); },
  setChatTheme(el) { const c = getContact(el.dataset.id); c.chatTheme = el.dataset.theme || null; state.chatThemePicker = false; showToast("Chat theme updated"); render(); },
  backupChat() {
    const c = getContact(state.selectedContactId);
    const msgs = state.messagesByContact[c.id] || [];
    const lines = msgs.map((m) => `[${m.time}] ${m.sender === "me" ? "Me" : (c.name || c.username)}: ${m.type === "text" ? m.text : m.type === "image" ? "[Photo]" : m.type === "file" ? `[File: ${m.fileName}]` : "[Voice message]"}`);
    const blob = new Blob([lines.join("\n")], { type: "text/plain" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const safeName = (c.username || c.name || "chat").replace(/[^a-zA-Z0-9_-]/g, "_");
    a.href = url; a.download = `chat-${safeName}.txt`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    state.chatMenuOpen = false;
    showToast("Chat backed up");
    render();
  },
  toggleMute(el) { const c = getContact(el.dataset.id); c.muted = !c.muted; state.chatMenuOpen = false; render(); },
  toggleBlock(el) { const c = getContact(el.dataset.id); c.blocked = !c.blocked; state.chatMenuOpen = false; showToast(c.blocked ? "Contact blocked" : "Contact unblocked"); render(); },
  confirmDeleteAll(el) {
    const id = el.dataset.id;
    state.chatMenuOpen = false;
    if (!confirm("Delete all messages in this chat? This cannot be undone.")) { render(); return; }
    state.messagesByContact[id] = [];
    const c = getContact(id); if (c) c.lastMessage = "";
    showToast("All messages deleted");
    render();
  },
  openContactProfile() { const c = getContact(state.selectedContactId); state.editContactDraftName = c.name || ""; navigateTo("contactProfile"); },
  saveContactName(el) { const c = getContact(el.dataset.id); c.name = (state.editContactDraftName || "").trim(); showToast("Name saved"); render(); },
  startEditProfile() { state.editDraftName = state.myAccount.name; state.editDraftUsername = state.myAccount.username; state.editDraftAvatar = undefined; navigateTo("editProfile"); },
  saveProfile() {
    const uname = (state.editDraftUsername || "").trim();
    if (!/^@[a-zA-Z0-9_]{2,20}$/.test(uname)) { showToast("Username must start with @ and use letters, numbers, or _"); return; }
    state.myAccount.name = (state.editDraftName || "").trim() || state.myAccount.name;
    state.myAccount.username = uname;
    if (state.editDraftAvatar !== undefined) state.myAccount.avatar = state.editDraftAvatar;
    showToast("Profile updated");
    goBack();
  },
  viewImage(el) { const m = findMessage(el.dataset.id); if (m && m.dataUrl) window.open(m.dataUrl, "_blank"); },
  downloadFile(el) { const m = findMessage(el.dataset.id); if (!m) return; const a = document.createElement("a"); a.href = m.dataUrl; a.download = m.fileName || "file"; document.body.appendChild(a); a.click(); document.body.removeChild(a); },
  toggleAudioPlay(el) { const id = el.dataset.id; state.playingMsgId = state.playingMsgId === id ? null : id; render(); },
  mockPlayToast() { showToast("Playback isn't available in this preview"); },
  startRecording() { startRecording(); },
  stopRecording() { stopRecording(false); },
  cancelRecording() { stopRecording(true); },
};

/* ======================= event wiring ======================= */
let touchStartX = null;
function onClick(e) {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  e.preventDefault();
  const fn = actions[el.getAttribute("data-action")];
  if (fn) fn(el, e);
}
function onInput(e) {
  const bind = e.target.getAttribute && e.target.getAttribute("data-bind");
  if (bind) { state[bind] = e.target.value; render(); }
}
function onKeydown(e) {
  if (e.key === "Enter" && e.target.id === "input-draft") { e.preventDefault(); actions.sendMessage(); }
}
function onTouchStart(e) { touchStartX = e.touches[0].clientX; }
function onTouchEnd(e) {
  if (touchStartX === null) return;
  const blocked = state.screen !== "home" || state.showAddModal || state.emojiPickerOpen || state.attachMenuOpen || state.chatThemePicker || state.menuOpen || state.showCreateGroupModal || state.showCreateBroadcastModal || state.showQrModal || state.modePickerOpen || state.homeSelectMode;
  if (!blocked) {
    const delta = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(delta) > 50) {
      if (delta < 0 && state.tabIndex < 2) { state.tabIndex++; render(); }
      if (delta > 0 && state.tabIndex > 0) { state.tabIndex--; render(); }
    }
  }
  touchStartX = null;
}
async function onFileAvatar(e) { const file = e.target.files[0]; if (!file) return; const url = await fileToDataURL(file); state.editDraftAvatar = url; render(); e.target.value = ""; }
async function onFilePhoto(e) { const file = e.target.files[0]; if (!file) return; const url = await fileToDataURL(file); pushMessage({ type: "image", dataUrl: url }); e.target.value = ""; }
async function onFileDocument(e) { const file = e.target.files[0]; if (!file) return; const url = await fileToDataURL(file); pushMessage({ type: "file", dataUrl: url, fileName: file.name, fileSize: file.size }); e.target.value = ""; }

function init() {
  app = document.getElementById("app");
  const phone = document.getElementById("phone");
  phone.addEventListener("click", onClick);
  phone.addEventListener("input", onInput);
  phone.addEventListener("keydown", onKeydown);
  phone.addEventListener("touchstart", onTouchStart, { passive: true });
  phone.addEventListener("touchend", onTouchEnd, { passive: true });
  document.getElementById("fileAvatar").addEventListener("change", onFileAvatar);
  document.getElementById("filePhoto").addEventListener("change", onFilePhoto);
  document.getElementById("fileDocument").addEventListener("change", onFileDocument);
  render();
  setInterval(tickAmbientPresence, 7000);
}
document.addEventListener("DOMContentLoaded", init);
</script>
