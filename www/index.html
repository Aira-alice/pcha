  .lc-scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  @keyframes lc-spin { to { transform: rotate(360deg); } }
  @keyframes lc-toast-in { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
  @keyframes lc-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
  #phone input::placeholder { color: var(--muted, #888); }
  #phone button, #phone input { font-family: inherit; }
  #phone button { -webkit-tap-highlight-color: transparent; }
</style>

/* ======================= firebase networking (Online mode) =======================
   Only powers the "Online (Internet)" connection mode. Local Online
   (WiFi/Bluetooth) is a separate transport and isn't wired up here.
   Only 1:1 contacts sync over the network in this version -- groups and
   broadcasts stay local-only for now. Only plain text messages sync;
   photo/file attachments stay on-device only (their base64 data is too
   large for this simple setup). */
const firebaseConfig = {
  apiKey: "AIzaSyDUO3d_cNU4IRD4emq4Am-u4QFr6YYqLXg",
  authDomain: "pchat-f7799.firebaseapp.com",
  databaseURL: "https://pchat-f7799-default-rtdb.firebaseio.com/",
  projectId: "pchat-f7799",
  storageBucket: "pchat-f7799.firebasestorage.app",
  messagingSenderId: "474954018141",
  appId: "1:474954018141:web:4cb15af74e2fe1bc38ccb4",
  measurementId: "G-7YGV3ZJTFW",
};
firebase.initializeApp(firebaseConfig);
const fbAuth = firebase.auth();
const fbDb = firebase.database();

let fbReady = false;      // true once anonymous sign-in has completed
let fbChatRefs = {};      // contact id -> live database ref (so it can be detached later)
let fbRequestsRef = null; // ref currently being listened to for incoming contact requests
let fbAcceptedRef = null; // ref currently being listened to for accepted requests
const FB_SESSION_START = Date.now(); // ignore chat history from before this app session, so reconnecting doesn't replay old messages as "new" incoming ones

// Realtime Database keys can't contain . # $ [ ] / -- usernames here only
// ever use @ and word characters, but strip the @ too, so keys stay simple.
function fbKey(username) { return String(username || "").replace(/[^a-zA-Z0-9_]/g, ""); }
// Deterministic per-pair chat room id: the same value no matter which side
// computes it, so both devices read/write the same node.
function fbChatId(a, b) { return [fbKey(a), fbKey(b)].sort().join("__"); }

// Email/Password is the real, persistent identity now (Anonymous auth was
// turned off in the Firebase console) -- this just watches for a signed-in
// session and reacts, rather than actively signing in itself. Firebase
// keeps a session across normal reloads on the same install; it's only
// gone after a real logout, a fresh install, or "clear app data", which is
// exactly when the login/signup screen (see renderAuthScreen) should show.
// Dipakai fbSignIn() supaya auto-reconnect Google (lihat di bawah) cuma
// dicoba SEKALI per sesi app -- kalau tidak dijaga, tiap logout manual akan
// langsung memicu auto-reconnect lagi dan bikin tombol "Keluar" seperti
// tidak berfungsi.
let autoReconnectAttempted = false;
function fbSignIn() {
  fbAuth.onAuthStateChanged((user) => {
    if (user) {
      fbReady = true;
      state.authChecking = false;
      state.authBusy = false;
      state.authError = "";
      fbLoadProfileSnapshot(user.uid).then(() => {
        state.isAuthed = true;
        // Brand new account (see fbLoadProfileSnapshot): stop here and show
        // the username/name onboarding screen instead of entering the app.
        // finishOnboardingName() picks up exactly where the branch below
        // left off (register presence, attach listeners, go online) once
        // the user finishes it.
        if (state.needsOnboarding) { render(); return; }
        // BUG FIX: fbRegisterPresence() bisa mengganti state.myAccount.username
        // (lihat catatan di sana) kalau ada tabrakan -- listener di bawah
        // memakai fbKey(state.myAccount.username), jadi harus menunggu
        // username final dulu, bukan langsung jalan paralel dengan nilai lama.
        fbRegisterPresence().then(() => {
          fbListenForRequests();
          fbListenForAccepted();
          fbListenForGroupInvites();
          if (state.connectionMode === "online") fbGoOnline();
          render();
        });
        render();
      });
    } else {
      fbReady = false;
      state.isAuthed = false;
      state.needsOnboarding = false;
      // BUG FIX (kritis): sesi Firebase Auth di sisi JS (yang menentukan
      // state.isAuthed) ternyata tidak selalu bertahan setelah aplikasi
      // Android benar-benar ditutup dan dibuka lagi -- walau sesi Google
      // di level native (dikelola @capacitor-firebase/authentication /
      // Play Services) tetap tersimpan. Itu sebabnya dulu user harus tap
      // "Lanjutkan dengan Google" tiap buka app, dan tap itu langsung
      // berhasil tanpa perlu pilih akun lagi -- karena sebenarnya cuma
      // mengulang pertukaran token yang seharusnya bisa otomatis. Coba
      // sambungkan ulang otomatis lewat sesi Google native itu SEKALI di
      // sini, sebelum benar-benar menyerah dan menampilkan layar login
      // manual. Kalau berhasil, onAuthStateChanged akan terpanggil lagi
      // dengan user terisi dan masuk ke cabang di atas seperti biasa.
      if (!autoReconnectAttempted) {
        autoReconnectAttempted = true;
        render(); // authChecking masih true di sini -> splash, bukan form login
        attemptSilentGoogleReconnect().then((reconnected) => {
          if (!reconnected) { state.authChecking = false; render(); }
        });
      } else {
        state.authChecking = false;
        render();
      }
    }
  });
}
// Coba sambung ulang sesi lewat akun Google yang sudah tersimpan di level
// native, TANPA menampilkan apa pun ke user -- lihat catatan BUG FIX di
// fbSignIn(). Hanya berlaku di app Android native (bukan browser biasa),
// dan gagal secara diam-diam (tanpa toast error) kalau memang tidak ada
// sesi Google tersimpan -- itu artinya user memang belum/sudah tidak login,
// jadi wajar ditampilkan layar login manual.
function attemptSilentGoogleReconnect() {
  let usedGoogleBefore = false;
  try { usedGoogleBefore = localStorage.getItem(GOOGLE_AUTH_FLAG_KEY) === "1"; } catch (e) {}
  if (!usedGoogleBefore) return Promise.resolve(false);
  const cap = window.Capacitor;
  if (!cap || !cap.isNativePlatform || !cap.isNativePlatform()) return Promise.resolve(false);
  const FirebaseAuthentication = cap.Plugins && cap.Plugins.FirebaseAuthentication;
  if (!FirebaseAuthentication) return Promise.resolve(false);
  return FirebaseAuthentication.signInWithGoogle().then((result) => {
    const idToken = result && result.credential && result.credential.idToken;
    if (!idToken) return false;
    const credential = firebase.auth.GoogleAuthProvider.credential(idToken);
    return fbAuth.signInWithCredential(credential).then(() => true);
  }).catch(() => false);
}
// Pulls this account's saved profile (contacts/groups/history) down from
// the server -- this is what makes login-after-reinstall actually restore
// everything, since local storage alone doesn't survive that. `deviceId`
// is deliberately excluded/preserved -- it identifies THIS install, not
// the account, so it should never be overwritten by a snapshot saved from
// a different device.
function fbLoadProfileSnapshot(uid) {
  const localDeviceId = state.myAccount.deviceId;
  return fbDb.ref("profiles/" + uid).once("value").then((snap) => {
    const val = snap.val();
    if (val) {
      if (val.myAccount) state.myAccount = Object.assign({}, val.myAccount, { deviceId: localDeviceId });
      if (Array.isArray(val.contacts)) state.contacts = val.contacts;
      if (Array.isArray(val.groups)) state.groups = val.groups;
      if (Array.isArray(val.broadcasts)) state.broadcasts = val.broadcasts;
      if (val.messagesByContact) state.messagesByContact = val.messagesByContact;
      saveAppStateToStorage();
    } else {
      // Nothing saved for this account yet (brand new Google sign-in) --
      // don't push a default profile. Ask for a username, then a name
      // (see renderOnboarding / finishOnboardingName) before the account
      // is actually created; a real email is already guaranteed unique by
      // Firebase Auth (1 email = 1 account) and this device's suggestion
      // is pre-filled from it for convenience, not a fixed identity.
      state.needsOnboarding = true;
      state.onboardStep = "username";

  // navigation carry the user (and the still-recording mic) somewhere
  // else. The recording UI itself (Send/trash buttons) is the only way
  // out while it's running; see discardAllActiveRecordings() for what
  // happens if the user leaves anyway (backgrounding the tab, etc.).
  if (screen !== "chat" && state.screen === "chat" && isCurrentChatRecording()) {
    showToast("Finish or delete the recording first");
    return;
  }
  if (screen === "home") state.screenStack = ["home"];
  // The contacts page is a transient "new chat" picker, not a destination
  // worth keeping in the back stack — treat it like home so back-navigation
  // from a freshly opened chat returns straight to the list.
  else state.screenStack.push((state.screen === "contactsPage") ? "home" : state.screen);
  if (state.screen === "chat" && screen !== "chat") clearTypingStatus();
  state.screen = screen;
  state.menuOpen = false; state.chatMenuOpen = false; state.chatSearchOpen = false; state.selectMode = false; state.chatThemePicker = false; state.emojiPickerOpen = false; state.attachMenuOpen = false;
  if (screen === "chat" && state.selectedContactId) {
    const c = getContact(state.selectedContactId);
    if (c) { c.unread = 0; markContactMessagesRead(c); }
  }
  render();
}
function goBack() {
  if (state.screen === "chat" && isCurrentChatRecording()) {
    showToast("Finish or delete the recording first");
    return;
  }
  const prev = state.screenStack.length ? state.screenStack.pop() : "home";
  if (state.screen === "chat" && prev !== "chat") clearTypingStatus();
  state.screen = prev;
  state.menuOpen = false; state.chatMenuOpen = false; state.chatSearchOpen = false; state.selectMode = false;
  state.emojiPickerOpen = false; state.attachMenuOpen = false; state.chatThemePicker = false;
  render();
}

function hasChatHistory(id) { return (state.messagesByContact[id] || []).length > 0; }
function getHomeConversations() {
  // Groups always stay in the list (they can only be removed by leaving them).
  // Contacts and broadcasts only appear once they have an actual conversation —
  // clearing a chat's history removes it from this list until a new message starts it again.
  const list = state.contacts.filter((c) => hasChatHistory(c.id)).concat(state.groups).concat(state.broadcasts.filter((b) => hasChatHistory(b.id)));
  return list.slice().sort((a, b) => (b.lastActivityAt || 0) - (a.lastActivityAt || 0));
}

}

// Shared grid markup for a mediaGroup's preview inside a chat bubble: up to
// 4 cells, first-3 shown plainly, the 4th gets a "+N" dark overlay if the
// group actually holds more than 4 items. Video cells get a small play
// badge so they're distinguishable from photos at a glance. Returns just
// the grid -- callers wrap it with whatever click/select behavior applies.
function renderMediaGroupGrid(items) {
  const total = items.length;
  const shown = items.slice(0, 4);
  const extra = total - 4;
  return `<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:3px;width:200px;">
    ${shown.map((it, i) => {
      const isOverflowCell = i === 3 && extra > 0;
      const media = it.type === "video"
        ? `<video src="${it.dataUrl}" muted style="width:100%;height:100%;object-fit:cover;display:block;"></video>`
        : `<img src="${it.dataUrl}" style="width:100%;height:100%;object-fit:cover;display:block;">`;
      const playBadge = (it.type === "video" && !isOverflowCell) ? `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;"><span style="width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,0.45);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;">▶</span></div>` : "";
      const overlay = isOverflowCell ? `<div style="position:absolute;inset:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700;">+${extra}</div>` : "";
      return `<div style="position:relative;aspect-ratio:1;overflow:hidden;border-radius:6px;">${media}${playBadge}${overlay}</div>`;
    }).join("")}
  </div>`;
}
function renderMessageContent(m, t) {
  if (state.selectMode) {
    if (m.type === "image") return `<img src="${m.dataUrl}" style="max-width:200px;border-radius:12px;display:block;pointer-events:none;">`;
    if (m.type === "video") return `<video src="${m.dataUrl}" muted style="max-width:200px;border-radius:12px;display:block;pointer-events:none;"></video>`;
    if (m.type === "mediaGroup") return `<div style="pointer-events:none;">${renderMediaGroupGrid(m.items)}</div>`;
    if (m.type === "file") return `<div style="display:flex;align-items:center;gap:10px;min-width:180px;"><div style="width:38px;height:38px;border-radius:10px;background:rgba(0,0,0,0.15);display:flex;align-items:center;justify-content:center;font-size:18px;">📄</div><div><div style="font-size:13px;font-weight:600;">${escapeHtml(m.fileName || "File")}</div><div style="font-size:11px;opacity:0.75;">${formatBytes(m.fileSize)}</div></div></div>`;
    if (m.type === "voice") return `<div style="display:flex;align-items:center;gap:8px;min-width:160px;"><span>🎤</span><span style="font-size:11px;">${formatDuration(m.duration)}</span></div>`;
    return `<span>${escapeHtml(m.text || "").replace(/\n/g, "<br>")}</span>`;
  }
  if (m.type === "image") return `<img src="${m.dataUrl}" data-action="viewImage" data-id="${m.id}" style="max-width:200px;border-radius:12px;display:block;cursor:pointer;">`;
  if (m.type === "video") return `<div data-action="viewImage" data-id="${m.id}" style="position:relative;max-width:200px;border-radius:12px;overflow:hidden;cursor:pointer;display:inline-block;">
    <video src="${m.dataUrl}" muted style="max-width:200px;display:block;"></video>
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;"><span style="width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,0.45);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;">▶</span></div>
  </div>`;
  if (m.type === "mediaGroup") return `<div data-action="openMediaGroup" data-id="${m.id}" style="cursor:pointer;">${renderMediaGroupGrid(m.items)}</div>`;
  if (m.type === "file") return `<div data-action="downloadFile" data-id="${m.id}" style="display:flex;align-items:center;gap:10px;cursor:pointer;min-width:180px;"><div style="width:38px;height:38px;border-radius:10px;background:rgba(0,0,0,0.15);display:flex;align-items:center;justify-content:center;font-size:18px;">📄</div><div style="min-width:0;"><div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(m.fileName || "File")}</div><div style="font-size:11px;opacity:0.75;">${formatBytes(m.fileSize)}</div></div></div>`;
  if (m.type === "voice") {

function renderQrPattern(seed) {
  let h = hashId(seed || "lc");
  const cells = 7;
  let cellsHtml = "";
  for (let i = 0; i < cells * cells; i++) {
    h = (h * 1103515245 + 12345) >>> 0;
    const on = (h % 3) !== 0;
    const r = Math.floor(i / cells), c2 = i % cells;
    const isFinder = (r < 3 && c2 < 3) || (r < 3 && c2 >= cells - 3) || (r >= cells - 3 && c2 < 3);
    cellsHtml += `<div style="background:${(isFinder || on) ? "#111" : "#fff"};"></div>`;
  }
  return `<div style="display:grid;grid-template-columns:repeat(${cells},1fr);gap:2px;width:100%;height:100%;">${cellsHtml}</div>`;
}

          const blob = new Blob(rec.recordedChunks, { type: "audio/webm" });
          const url = URL.createObjectURL(blob);
          // The recording can only finish naturally (not be force-discarded)
          // while its chat is still the one on screen -- navigateTo()/
          // goBack() refuse to leave while rec.recording is true -- so cid
          // and state.selectedContactId are guaranteed to match here.
          pushMessage({ type: "voice", audioUrl: url, duration: rec.recordSeconds });
        }
        rec.mediaRecorder = null;
      };
      mr.start();
    } catch (err) { rec.recordMock = true; }
  } else { rec.recordMock = true; }
  rec.recordTimer = setInterval(() => { rec.recordSeconds++; render(); }, 1000);
}
function stopRecording(cancel, cid) {
  cid = cid || state.selectedContactId;
  const rec = state.recordingByContact[cid];
  if (!rec || !rec.recording) return;
  clearInterval(rec.recordTimer);
  rec.recording = false;
  rec.recordCancelled = !!cancel;
  if (rec.recordMock) {
    // Mock path only makes sense for the chat still on screen (no real
    // MediaRecorder/mic involved) -- pushMessage always targets whatever
    // chat is currently selected.
    if (!cancel && cid === state.selectedContactId) pushMessage({ type: "voice", audioUrl: null, duration: rec.recordSeconds });
    rec.recordMock = false;
    render();
    return;
  }
  if (rec.mediaRecorder && rec.mediaRecorder.state !== "inactive") rec.mediaRecorder.stop();
  render();
}
// Called when the user is forced out of the chat entirely (tab hidden,

function discardAllActiveRecordings() {
  let discardedAny = false;
  Object.keys(state.recordingByContact).forEach((cid) => {
    if (state.recordingByContact[cid].recording) { stopRecording(true, cid); discardedAny = true; }

const actions = {
  // Native Google account picker (via the @capacitor-firebase/authentication
  // plugin's native layer -- see setup notes) -- returns a real Google ID
  // token, which is then handed to the Firebase JS SDK so fbAuth/fbDb keep
  // working exactly as before. onAuthStateChanged (fbSignIn) does the rest:
  // it decides new-account (-> onboarding) vs existing-account (-> load
  // profile) once the credential sign-in resolves.
  authGoogleSignIn() {
    state.authError = "";
    state.authDebug = "";
    const cap = window.Capacitor;
    if (!cap || !cap.isNativePlatform || !cap.isNativePlatform()) {
      state.authError = "Login Google cuma jalan di aplikasi Android, bukan saat dibuka lewat browser biasa.";
      render();
      return;
    }
    const FirebaseAuthentication = cap.Plugins && cap.Plugins.FirebaseAuthentication;
    if (!FirebaseAuthentication) {
      state.authError = "Plugin Google Sign-In belum terpasang di build ini.";
      render();
      return;
    }
    state.authBusy = true; render();
    FirebaseAuthentication.signInWithGoogle().then((result) => {
      const idToken = result && result.credential && result.credential.idToken;
      if (!idToken) throw new Error("no-id-token, hasil signInWithGoogle: " + safeStringify(result));
      const credential = firebase.auth.GoogleAuthProvider.credential(idToken);
      return fbAuth.signInWithCredential(credential).then(() => {
        // Tandai supaya lain kali app dibuka, attemptSilentGoogleReconnect()
        // tahu device ini boleh dicoba disambungkan ulang otomatis lewat
        // Google -- lihat catatan di GOOGLE_AUTH_FLAG_KEY.
        try { localStorage.setItem(GOOGLE_AUTH_FLAG_KEY, "1"); } catch (e) {}
      });
    }).catch((err) => {
      console.error("Google sign-in failed", err);
      state.authBusy = false;
      const msg = String((err && (err.message || err.code)) || "");
      state.authError = /cancel/i.test(msg) ? "" : fbAuthErrorMessage(err);
      // TEMP DEBUG (hapus setelah Google Sign-In beres): dump semua properti
      // error native-nya -- pesan default (mis. "10:") terlalu pendek buat
      // didiagnosis, error aslinya (dari plugin/Play Services) biasanya
      // punya field lain (errorMessage, localizedMessage, stack, dll).
      state.authDebug = safeStringify(err);
      render();

    if (state.contacts.some((c) => fbKey(c.username) === targetKey)) { finish(); showToast(`${u} sudah ada di kontakmu`); render(); return; }
    // BUG FIX (kritis, penyebab utama "request tidak pernah sampai"):
    // versi lama membaca requests/{targetKey}/{meKey} dulu untuk cek "sudah

let touchStartX = null;
// While a recording is running, the only things the user can do are
// finish it (stopRecording, the composer's Send button) or trash it
// (cancelRecording) -- everything else (chat menu, contact profile,
// search, select mode, star/forward, block/mute, theme picker, emoji,
// attach...) is blocked here in one place, at the click dispatcher, so no
// new button added later can accidentally slip past it.
const ACTIONS_ALLOWED_WHILE_RECORDING = new Set(["stopRecording", "cancelRecording"]);
function onClick(e) {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  e.preventDefault();
  const actionName = el.getAttribute("data-action");
  if (state.screen === "chat" && isCurrentChatRecording() && !ACTIONS_ALLOWED_WHILE_RECORDING.has(actionName)) {
    showToast("Finish or delete the recording first");
    return;
  }
  const fn = actions[actionName];
  if (fn) fn(el, e);
}
const NO_RERENDER_BINDS = new Set(["draft", "editDraftUsername", "editContactDraftName", "newGroupName", "newBroadcastName", "onboardUsername", "onboardName"]);
const DEBOUNCED_RERENDER_BINDS = new Set(["chatSearchQuery", "addQuery", "editDraftName"]);
let inputDebounceTimer = null;
function updateComposerButton() {
  const btn = document.getElementById("composerSendBtn");
  if (!btn) return;
  const t = getEffectiveTheme();
  const cid = state.selectedContactId;
  const hasContent = ((state.draftsByContact[cid] || "").trim().length > 0) || ((state.attachmentsByContact[cid] || []).length > 0);
  btn.setAttribute("data-action", hasContent ? "sendMessage" : "startRecording");
  btn.innerHTML = hasContent ? iconSend(t.accentText, 16) : iconMic(t.accentText, 16);
}
function autoResizeDraft(el) {
  if (!el) return;
  el.style.height = "auto";
  const maxHeight = 120;
  const next = Math.min(el.scrollHeight, maxHeight);
  el.style.height = next + "px";
  el.style.overflowY = el.scrollHeight > maxHeight ? "auto" : "hidden";
}
function onInput(e) {
  const bind = e.target.getAttribute && e.target.getAttribute("data-bind");
  if (!bind) return;
  if (bind === "draft") {
    // Special-cased instead of the generic `state[bind] = value` below:
    // the draft now lives per-contact in draftsByContact, not as a flat
    // state.draft field.
    const cid = state.selectedContactId;
    if (cid != null) {
      state.draftsByContact[cid] = e.target.value;
      saveDraftsToStorage();
      notifyTyping(cid);
    }
    updateComposerButton();
    autoResizeDraft(e.target);
    return;
  }
  state[bind] = e.target.value;
  if (NO_RERENDER_BINDS.has(bind)) return;
  if (DEBOUNCED_RERENDER_BINDS.has(bind)) {
    clearTimeout(inputDebounceTimer);
    inputDebounceTimer = setTimeout(() => render(), 300);
    return;
  }
  render();
}
function onKeydown(e) {
  // Enter in the message field just inserts a new line (the textarea's
  // native behavior) since there's already a dedicated send button --
  // it no longer sends the message.
}
function onTouchStart(e) { touchStartX = e.touches[0].clientX; }
function onTouchEnd(e) {
  if (touchStartX === null) return;
  const blocked = state.screen !== "home" || state.showAddModal || state.emojiPickerOpen || state.attachMenuOpen || state.chatThemePicker || state.menuOpen || state.showCreateGroupModal || state.showCreateBroadcastModal || state.showAddGroupMemberModal || state.showQrModal || state.modePickerOpen || state.homeSelectMode;
  if (!blocked) {
    const delta = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(delta) > 50) {
      if (delta < 0 && state.tabIndex < 2) { state.tabIndex++; render(); }
      if (delta > 0 && state.tabIndex > 0) { state.tabIndex--; render(); }
    }

}
async function onFileAvatar(e) { const file = e.target.files[0]; if (!file) return; const url = await fileToDataURL(file); state.editDraftAvatar = url; render(); e.target.value = ""; }
async function onFilePhoto(e) {
  const files = Array.from(e.target.files || []);

  // Lock in which contact this batch belongs to before the async reads
  // below, so a chat switch mid-pick can't misattribute a file to whatever
  // contact happens to be open by the time a later file finishes reading.
  const cid = state.selectedContactId;
  if (cid == null) { e.target.value = ""; return; }
  if (!state.attachmentsByContact[cid]) state.attachmentsByContact[cid] = [];
  for (const file of files) {
    const url = await fileToDataURL(file);
    const isVideo = file.type.startsWith("video/");
    state.attachmentsByContact[cid].push({ id: uid(), kind: "media", type: isVideo ? "video" : "image", dataUrl: url, fileName: file.name });

// Sama seperti startRecording(): fungsi ini sengaja tidak melakukan apa
// pun selain toast, karena kirim dokumen asli butuh Firebase Storage

// begitu Storage tersedia, tinggal isi logika staging dokumennya di sini

  const files = Array.from(e.target.files || []);
  e.target.value = "";
  if (files.length === 0) return;

  showToast("Kirim dokumen belum bisa direalisasikan karena masalah uang");

function onComposerButtonMouseDown(e) {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  // Real text fields (the composer textarea, search box, etc.) must keep
  // their native tap-to-focus behavior -- only guard actual buttons/chrome.
  if (el.tagName === "INPUT" || el.tagName === "TEXTAREA") return;
  const active = document.activeElement;
  // If a text field is currently focused and this tap would move focus to a
  // different element, stop that native focus change. On Android in
  // particular, tapping any button (Send, mic, attach, the emoji toggle...)
  // while typing otherwise steals focus away from the textarea, which
  // dismisses gboard for a flicker even when the button's own action (e.g.
  // sending the message) doesn't call for the keyboard to close at all.
  // Actions that DO want the field blurred (like opening the emoji panel)
  // still do so explicitly via el.blur() in their own handler.
  if (active && active !== el && (active.tagName === "INPUT" || active.tagName === "TEXTAREA")) {
    e.preventDefault();
  }
}
function init() {
  app = document.getElementById("app");
  const phone = document.getElementById("phone");
  phone.addEventListener("click", onClick);
  phone.addEventListener("mousedown", onComposerButtonMouseDown);
  phone.addEventListener("input", onInput);
  phone.addEventListener("keydown", onKeydown);
  phone.addEventListener("touchstart", onTouchStart, { passive: true });
  phone.addEventListener("touchend", onTouchEnd, { passive: true });
  document.getElementById("fileAvatar").addEventListener("change", onFileAvatar);
  document.getElementById("filePhoto").addEventListener("change", onFilePhoto);
  document.getElementById("fileDocument").addEventListener("change", onFileDocument);
  loadDraftsFromStorage();
  loadAppStateFromStorage();
  if (!state.myAccount.deviceId) { state.myAccount.deviceId = generateDeviceId(); saveAppStateToStorage(); }
  fbSignIn();
  setupViewportLock();
  setupForcedExitHandling();
  render();

// Handles the case where the user leaves mid-recording through something
// the app itself can't block -- switching tabs/apps, locking the phone, or
// closing the page. In-progress audio is discarded (never auto-sent), and
// a toast explains this once the user is actually looking at the screen
// again (there's no point showing it while the tab is hidden).
function setupForcedExitHandling() {
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      discardAllActiveRecordings();
    } else if (state.pendingRecordingDiscardedNotice) {
      state.pendingRecordingDiscardedNotice = false;
      showToast("Recording deleted — you left the chat");
    }
  });
  window.addEventListener("pagehide", discardAllActiveRecordings);
}
function setupViewportLock() {
  // On mobile, focusing the composer's textarea makes the browser try to
  // "scroll the focused field into view" -- a native behavior that runs
  // even with overflow:hidden on html/body. That scroll shifts what's
  // actually visible without the CSS layout knowing, so the top bar
  // (back/menu/contact name) or the composer end up clipped outside the
  // visible area depending on scroll direction. Pin #stage to whatever
  // window.visualViewport reports as truly visible, on every change, so
  // the layout always matches reality instead of trusting dvh alone.
  const stage = document.getElementById("stage");
  if (!stage) return;
  function sync() {
    const vv = window.visualViewport;
    if (vv) {
      stage.style.width = vv.width + "px";
      stage.style.height = vv.height + "px";
      stage.style.left = vv.offsetLeft + "px";
      stage.style.top = vv.offsetTop + "px";
    }
    // Belt-and-suspenders: if the browser nudged the outer document itself
    // (rather than just the visual viewport), snap it back to 0,0 so
    // nothing sits scrolled out of view above or below.
    if (window.scrollX !== 0 || window.scrollY !== 0) window.scrollTo(0, 0);
    // Same idea for the composer's own internal scrollTop: this fires
    // repeatedly while the on-screen keyboard animates open/closed, and on
    // some mobile browsers each of those intermediate layout passes can
    // visibly nudge a nearby scrollable element on its own -- causing a
    // brief flash back to the top of a multi-line draft before it settles,
    // even though render() already set the right value once, synchronously,
    // before that animation even started. Keep re-asserting it on every
    // tick for a short window after each render() so any such nudge gets
    // corrected on the very next frame instead of staying visible.
    if (Date.now() < composerScrollCorrectionUntil && composerScrollTopTarget != null) {
      const inp = document.getElementById("input-draft");
      if (inp && inp.scrollTop !== composerScrollTopTarget) inp.scrollTop = composerScrollTopTarget;
    }
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", sync);
    window.visualViewport.addEventListener("scroll", sync);
  }
  window.addEventListener("scroll", sync, { passive: true });
  window.addEventListener("orientationchange", sync);
  sync();
}
document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
