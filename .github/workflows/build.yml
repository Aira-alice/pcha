name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx cap add android

      # android/ dibuat ulang dari nol tiap build (npx cap add android),
      # jadi edit native di bawah ini WAJIB dijalankan tiap kali juga --
      # bukan sekali edit manual, soalnya bakal ketimpa lagi.

      - name: Aktifkan dependency native Google Sign-In
        run: |
          sed -i "s/ext {/ext {\n    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = '1.3.0'/" android/variables.gradle

      - name: Tambah Google Services Gradle plugin
        run: |
          sed -i "s/classpath 'com.android.tools.build:gradle:.*'/&\n        classpath 'com.google.gms:google-services:4.4.2'/" android/build.gradle

      - name: Taruh google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Pakai debug keystore yang tetap (SHA-1 konsisten tiap build)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - run: npx cap sync android
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: "[DEBUG] Cek isi google-services.json (angka saja, tidak disensor)"
        run: |
          echo "SHA-1 keystore build ini:"
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep "SHA1:"
          echo ""
          SHA1_NOCOLON=$(echo "84:03:75:AC:3E:5C:EA:77:66:71:04:A2:A6:07:1F:5A:63:37:64:D7" | tr -d ':' | tr 'A-Z' 'a-z')
          echo "Jumlah SHA-1 kita ditemukan di google-services.json (harus >= 1):"
          grep -o -i "$SHA1_NOCOLON" android/app/google-services.json | wc -l
          echo ""
          echo "Jumlah OAuth client tipe Android / client_type:1 di file (harus >= 1):"
          grep -o '"client_type": *1' android/app/google-services.json | wc -l
          echo ""
          echo "Jumlah OAuth client tipe Web / client_type:3 di file (harus >= 1, ini yang dipakai plugin buat ambil ID token):"
          grep -o '"client_type": *3' android/app/google-services.json | wc -l
          echo ""
          echo "Jumlah package_name com.imda.pchat cocok di file (harus >= 1):"
          grep -c "com.imda.pchat" android/app/google-services.json

      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
