name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx cap add android

      # android/ dibuat ulang dari nol tiap build (npx cap add android),
      # jadi edit native di bawah ini WAJIB dijalankan tiap kali juga --
      # bukan sekali edit manual, soalnya bakal ketimpa lagi.

      - name: Aktifkan dependency native Google Sign-In
        run: |
          sed -i "s/ext {/ext {\n    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = '1.3.0'/" android/variables.gradle

      - name: Tambah Google Services Gradle plugin
        run: |
          sed -i "s/classpath 'com.android.tools.build:gradle:.*'/&\n        classpath 'com.google.gms:google-services:4.4.2'/" android/build.gradle

      - name: Taruh google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Pakai debug keystore yang tetap (SHA-1 konsisten tiap build)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
